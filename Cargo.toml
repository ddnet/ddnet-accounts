[workspace]
members = [
    "lib/ddnet-account-client",
    "lib/ddnet-account-game-server",
    "lib/ddnet-accounts-shared",
    "lib/ddnet-account-sql",
    "lib/ddnet-accounts-types",
    "lib/ddnet-account-client-http-fs",
    "lib/ddnet-account-client-reqwest",
]

[package]
name = "ddnet-accounts"
version = "0.3.0"
edition = "2024"
authors = ["Jupeyy"]
license = "MIT OR Apache-2.0"
description = "The account server binary, which takes HTTP requests for account related operations."
repository = "https://github.com/ddnet/ddnet-accounts"

[[bin]]
path = "src/main.rs"
name = "account-server"

[dependencies]
ddnet-accounts-types = { version = "0.2", path = "lib/ddnet-accounts-types" }
ddnet-accounts-shared = { version = "0.3", path = "lib/ddnet-accounts-shared" }
ddnet-account-sql = { version = "0.4", path = "lib/ddnet-account-sql", features = ["mysql"] }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time", "macros"] }
axum = "0.8"
anyhow = { version = "1", features = ["backtrace"] }
sqlx = { version = "0.9", features = ["mysql", "any", "runtime-tokio", "tls-rustls", "chrono"] }
email_address = { version = "0.2", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["serde", "pkcs8"] }
async-trait = "0.1"
argon2 = "0.5"
serde_json = "1"
parking_lot = "0.12"
lettre = "0.11"
serde = { version = "1", features = ["derive"] }
url = { version = "2", features = ["serde"] }
log = "0.4"
clap = { version = "4", features = ["derive", "cargo"] }
env_logger = "0.11"
rcgen = { version = "0.14" }
x509-cert = { version = "0.2", features = ["builder"] }
ecdsa = { version = "0.16", features = ["digest", "pem"] }
p256 = "0.13"
rand = { version = "0.8", features = ["getrandom"], default-features = false }
sha2 = { version = "0.10", features = ["oid"] }
der = { version = "0.7", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tower_governor = "0.8"
tower = "0.5"
strum = { version = "0.28", features = ["derive"] }
reqwest = { version = "0.13" }
hex = "0.4"
iprange = "0.6"
ipnet = "2"
either = "1"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

[dev-dependencies]
ddnet-account-client = { version = "0.3", path = "lib/ddnet-account-client" }
ddnet-account-game-server = { version = "0.4", path = "lib/ddnet-account-game-server" }
ddnet-account-client-http-fs = { version = "0.4", path = "lib/ddnet-account-client-http-fs" }
ddnet-account-client-reqwest = { version = "0.4", path = "lib/ddnet-account-client-reqwest" }

regex = "1"
tempfile = "3"
